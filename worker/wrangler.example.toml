name = "sok-chat"
main = "sok-chat-worker.js"
compatibility_date = "2025-01-01"
account_id = "ВАШ_ACCOUNT_ID"

[[kv_namespaces]]
binding = "KV"
id = "ВАШ_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "CHAT_DO"
class_name = "ChatStore"

[vars]
# Секреты не хранить в git! Токен бота задать так:
# 1) локально: создайте wrangler.toml (в .gitignore) по образцу wrangler.example.toml
# 2) или в dash.cloudflare.com -> Workers -> sok-chat -> Settings -> Variables
BOT_TOKEN = "1234567890:AAA..."
